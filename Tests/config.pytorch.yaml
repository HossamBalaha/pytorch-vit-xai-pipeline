# ==============================================================================
# VIT IMAGE CLASSIFICATION PIPELINE - CONFIGURATION FILE.
# ==============================================================================
# Update the values below according to your dataset and training requirements.
# This configuration file contains parameters for the various ViT implementations.

# --- Data and Output Paths ---
# Path to the root directory of your dataset.
DataDir: "/path/to/your/dataset"

# Directory where results, models, and logs will be saved.
OutputDir: "./Tests/Experiments/Exp-XXX"

# --- Model Configuration ---
# Pass a list to run multiple models. The script will loop through all combinations.
# Available Options: "StandardViT", "T2TViT", "HierarchicalViT", "CLIPViT",
# "SwinTransformer", "SwinTransformerV2", "DeiT", "ConvNeXt", "ConvNeXtV2", "MaxViT", "BEiT", "FastViT", "EVA02",
# "EVA02Large", "ConvNeXtLargeCLIP", "SwinTransformerLarge384", "EfficientNetV2Large", "QuantumResNet",
# "VisionKANModel", "NeuralODEViTModel", "SpikingViTModel", "HypernetworkViTModel",
# "LiquidSSMViTModel", "TestTimeEvolvingViTModel", "TensorNetworkEntangledViTModel", "DiffusionPriorEnergyViTModel",
# "FractalResonanceViTModel", "TopologicalQuantumViTModel", "HolographicInterferenceViTModel",
# "NeuromorphicLiquidStateViTModel".
ModelName:
  - "QuantumResNet"
  - "VisionKANModel"
  - "NeuralODEViTModel"
  - "SpikingViTModel"
  - "HypernetworkViTModel"
  - "LiquidSSMViTModel"
  - "TestTimeEvolvingViTModel"
  - "TensorNetworkEntangledViTModel"
  - "DiffusionPriorEnergyViTModel"
  - "FractalResonanceViTModel"
  - "TopologicalQuantumViTModel"
  - "HolographicInterferenceViTModel"
  - "NeuromorphicLiquidStateViTModel"
  - "StandardViT"

# Enable loading pretrained ImageNet weights into custom from-scratch models.
# When enabled, compatible layers (patch embedding, class token, positional embedding,
# normalization, and classification head) are initialized from a pretrained ViT-Base,
# while custom blocks (KAN, ODE, Spiking, etc.) remain randomly initialized.
# This significantly improves convergence speed and final accuracy on small datasets.
UsePretrainedCustomModels: true

# The name of the timm pretrained model to use for initializing custom models.
# Examples: "vit_base_patch16_224", "vit_large_patch16_224", "vit_base_patch32_224",
# "vit_base_patch16_384", "vit_large_patch16_384", "vit_base_patch16_224_in21k",
# "vit_large_patch16_224_in21k", "vit_huge_patch14_224_in21k", "deit_base_patch16_224",
# "deit3_large_patch16_224_in21ft1k".
PretrainedModelName: "vit_base_patch16_224"

# --- Optimization Configuration ---
# Pass a list to run multiple optimizers.
# Available Options: "Adam", "AdamW", "SGD", "RMSprop", "RAdam", "Lion", "Prodigy", "ScheduleFreeAdamW", "Sophia".
Optimizer:
  - "AdamW"

# Pass a list to run multiple loss functions.
# Available Options: "CrossEntropy", "Focal", "LabelSmoothing".
LossFunction:
  - "CrossEntropy"

# Initial learning rate for the optimizer.
# Note: If using "Prodigy", this value is ignored as it auto-tunes the learning rate.
# LR of 0.00001 is recommended for most tasks, but you may need to adjust it based on your dataset and model.
# LR of 0.0001 is recommended for large datasets and models, while LR of 0.000001 is recommended for small datasets and models.
LearningRate: 0.0001

# Learning rate scheduler ("None", "CosineWarmup", "ReduceLROnPlateau").
Scheduler: "None"

# --- Training Hyperparameters ---
# Input image size (height and width) for resizing during preprocessing.
# Note: 224 is highly recommended for CLIP, SwinTransformer, and the new SOTA models.
ImageSize: 224

# Number of samples per batch.
BatchSize: 16

# Maximum number of training epochs.
NumEpochs: 100

# Number of epochs with no improvement after which training will be stopped (Early Stopping).
Patience: 25

# --- Advanced Training Features ---
# Enable Automatic Mixed Precision (AMP) for faster training and lower memory usage.
UseAmp: true

# Number of steps to accumulate gradients before updating weights (simulates larger batch size).
# Used when `UseAmp` is enabled. A value of 1 means no accumulation.
# Value of 2 or more is recommended for large models or limited GPU memory.
# Value of 1 is recommended for small models or when using large batch sizes.
AccumulationSteps: 1

# Enable Exponential Moving Average (EMA) for smoother weights and better generalization.
UseEma: true

# Enable MixUp and CutMix data augmentation.
UseMixup: true

# MixUp alpha parameter (higher means more mixing).
# Used when `UseMixup` is enabled. A value of 0.2 is recommended for most tasks.
MixupAlpha: 0.2

# CutMix alpha parameter.
# Used when `UseMixup` is enabled. A value of 1.0 is recommended for most tasks.
CutmixAlpha: 1.0

# Label smoothing value (0.0 to 1.0).
# Used when LossFunction is set to "LabelSmoothing". A value of 0.1 is recommended for most tasks.
# Also used when `UseMixup` is enabled, as MixUp implicitly applies label smoothing.
LabelSmoothing: 0.1

# --- Pipeline Control Parameters (Previously Hardcoded) ---
# Criterion to judge the best model for checkpointing and early stopping.
# Options: "val_loss", "val_accuracy", "both".
JudgeBy: "val_accuracy"

# Save a checkpoint every N epochs. Set to null to disable periodic saving.
SaveEvery: null

# Maximum gradient norm for clipping. Set to null to disable gradient clipping.
MaxGradNorm: null

# Whether to resume training from the last checkpoint if it exists.
ResumeFromCheckpoint: false

# --- Data Augmentation & Preprocessing ---
# Apply data augmentation techniques during training (e.g., random flips, rotations, color jitter).
UseAugmentation: true

# Specific options for digital pathology datasets (e.g., TCGA, CAMELYON16, etc.).
UseStainJitter: false
UseBackgroundRemoval: false
UseColorDeconvolution: false

# --- Experiment Management ---
# Computation device preference ("auto", "cpu", or "cuda").
Device: "cuda"

# Pass a list of random seeds for multi-trial execution to ensure statistical significance.
Seeds: [ 42, 43, 44, 45, 46 ]


# --- Topological Wasserstein Loss Hyperparameters ---
# Note: Topological Wasserstein Loss parameters (UseTopoWassersteinLoss, Epsilon,
# LambdaTopo, LambdaContrastive) have been removed as they are not supported
# by the standard HMB Training Pipeline wrapper.

# Enable the Topological Wasserstein Loss for single-resolution histopathology.
# Set to "false" to revert to standard classification training.
UseTopoWassersteinLoss: false

# Entropic regularization parameter for the Sinkhorn' algorithm.
# Lower values (e.g., 0.01) enforce stricter optimal transport but may cause numerical instability.
# Higher values (e.g., 0.5) smooth the transport plan but weaken the geometric alignment.
Epsilon: 0.1

# Weighting factor for the topological spatial penalty.
# Controls the strength of the persistent homology-inspired spatial distribution constraint.
LambdaTopo: 0.1

# Weighting factor for the contrastive Wasserstein loss against class prototypes.
# Controls the strength of the distributional alignment in the feature space.
LambdaContrastive: 0.1
